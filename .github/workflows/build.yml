name: Build TV launcher
on:
  workflow_dispatch:
  push:
    branches: [main, variant/apps-second-page]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Fetch pinned source
        run: |
          curl --fail --location --retry 3 https://github.com/Gathin23/cleanyourtv/archive/3f175120f9802ab4364f61d040db9aa78ec71493.tar.gz -o source.tar.gz
          mkdir source
          tar -xzf source.tar.gz -C source --strip-components=1
      - name: Apply launcher configuration
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path('source/launcher/app/src/main/res/values/config.xml')
          tree = ET.parse(path)
          for key, value in json.loads(Path('launcher-settings.json').read_text()).items():
              node = next(n for n in tree.getroot() if n.get('name') == key)
              if isinstance(value, list):
                  for child in list(node): node.remove(child)
                  for item in value: ET.SubElement(node, 'item').text = str(item)
              else:
                  node.text = str(value).lower() if isinstance(value, bool) else str(value)
          tree.write(path, encoding='utf-8', xml_declaration=True)
          build = Path('source/launcher/app/build.gradle')
          text = build.read_text()
          assert 'signingConfig signingConfigs.debug' in text
          build.write_text(text.replace('signingConfig signingConfigs.debug', 'signingConfig null'))
          PY
      - name: Install home screen additions
        run: |
          cp overrides/*.java source/launcher/app/src/main/java/com/gathin/tvhome/
          mkdir -p source/launcher/app/src/main/java/com/cgutman/adblib
          cp vendor/adblib/*.java source/launcher/app/src/main/java/com/cgutman/adblib/
          cp -R assets source/launcher/app/src/main/
          cp -R res/. source/launcher/app/src/main/res/
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('source/launcher/app/src/main/AndroidManifest.xml')
          s = p.read_text().replace('<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />', '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" /><uses-permission android:name="android.permission.INTERNET" />')
          activity = '<activity android:name=".VoiceShortcutActivity" android:exported="true" android:excludeFromRecents="true" android:noHistory="true" android:theme="@android:style/Theme.NoDisplay"><intent-filter><action android:name="android.intent.action.ASSIST"/><action android:name="android.intent.action.VOICE_ASSIST"/><action android:name="android.intent.action.VOICE_COMMAND"/><action android:name="android.speech.action.WEB_SEARCH"/><action android:name="android.intent.action.SEARCH_LONG_PRESS"/><category android:name="android.intent.category.DEFAULT"/></intent-filter></activity>'
          s = s.replace('</application>', activity + '</application>')
          p.write_text(s)
          PYCODE
      - name: Install SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build and check
        working-directory: source/launcher
        run: bash ./gradlew --no-daemon --max-workers=2 testReleaseUnitTest lintRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-unsigned
          path: source/launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
